<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>HELP CARD - Advanced Emergency System</title>
<link rel="manifest" href="manifest.json">
<script>
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
</script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap');
body{font-family:'Outfit',system-ui;background:#020617;color:white}
.glass{background:rgba(30,41,59,0.8);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1)}
</style>
</head>
<body class="p-4 max-w-[520px] mx-auto">
<!-- HEADER -->
<div class="flex justify-between items-center py-3">
<h1 class="font-black text-xl">🚨 HELP CARD<span class="text-cyan-400"> PRO</span></h1>
<button onclick="installApp()" class="text-xs bg-white/10 px-3 py-1 rounded-full">Install App</button>
</div>

<!-- PROFILE SELECTOR -->
<div class="flex gap-2 overflow-auto py-2" id="profileList"></div>

<!-- MAIN FORM -->
<div class="glass rounded-[24px] p-5 mt-2" id="formCard">
<div class="flex gap-3">
<div class="w-20 h-20 rounded-2xl bg-slate-800 flex items-center justify-center text-3xl overflow-hidden" id="photoPreview">👤</div>
<div class="flex-1">
<input type="file" id="photoInput" accept="image/*" hidden onchange="loadPhoto(event)">
<button onclick="document.getElementById('photoInput').click()" class="text-xs bg-cyan-500 text-black px-3 py-1 rounded-full font-bold">Add Photo</button>
<input id="name" placeholder="Full Name" class="w-full mt-2 bg-transparent border-b border-white/20 p-2 outline-none">
</div>
</div>

<div class="grid grid-cols-2 gap-3 mt-4">
<select id="blood" class="bg-slate-900 p-3 rounded-xl"><option>B+ve</option><option>A+ve</option><option>O+ve</option><option>AB+ve</option><option>O-ve</option><option>A-ve</option><option>B-ve</option><option>AB-ve</option></select>
<input id="age" placeholder="Age" type="number" class="bg-slate-900 p-3 rounded-xl">
</div>
<input id="medical" placeholder="Allergies, Disease, Medicines (e.g. Asthma, Insulin)" class="w-full mt-3 bg-slate-900 p-3 rounded-xl">
<input id="c1" placeholder="Emergency Contact 1 - Name, Number" class="w-full mt-3 bg-slate-900 p-3 rounded-xl border border-green-500/30">
<input id="c2" placeholder="Emergency Contact 2 - Name, Number" class="w-full mt-3 bg-slate-900 p-3 rounded-xl">
<input id="addr" placeholder="Home Address" class="w-full mt-3 bg-slate-900 p-3 rounded-xl">

<div class="grid grid-cols-2 gap-3 mt-5">
<button onclick="saveProfile()" class="bg-cyan-400 text-black font-black py-3 rounded-xl">SAVE & GENERATE QR</button>
<button onclick="sos()" class="bg-red-500 font-black py-3 rounded-xl animate-pulse">🆘 SOS - SEND LOCATION</button>
</div>

<div id="qrBox" class="hidden mt-6 bg-white rounded-[20px] p-4 text-center">
<img id="qrImg" class="w-[280px] h-[280px] mx-auto">
<p class="text-black font-bold mt-2" id="qrName">Name - Blood</p>
<div class="grid grid-cols-2 gap-2 mt-3">
<a id="dlBtn" download="HELP-CARD-QR.png" class="bg-black text-white py-2 rounded-xl text-sm font-bold">Download QR</a>
<button onclick="makeWallpaper()" class="bg-slate-200 text-black py-2 rounded-xl text-sm font-bold">Make Wallpaper</button>
</div>
</div>
</div>

<!-- EMERGENCY VIEW (When scanned) -->
<div id="emView" class="hidden">
<div class="bg-red-600 rounded-[20px] p-4 text-center font-black text-2xl">🚨 EMERGENCY - PLEASE HELP</div>
<div class="glass rounded-[20px] p-5 mt-4 text-center">
<img id="vPhoto" class="w-24 h-24 rounded-full mx-auto object-cover hidden">
<h2 id="vName" class="text-3xl font-black mt-3"></h2>
<p id="vBlood" class="text-red-400 font-black text-2xl"></p>
<p id="vMedical" class="mt-3 bg-yellow-500/20 p-3 rounded-xl"></p>
<a id="vC1" class="block mt-4 bg-green-500 text-black font-black text-xl py-4 rounded-xl">CALL 1</a>
<a id="vC2" class="block mt-3 bg-cyan-400 text-black font-black text-xl py-4 rounded-xl">CALL 2</a>
<p id="vAddr" class="text-sm text-slate-400 mt-4"></p>
<button onclick="shareLive()" class="w-full mt-4 bg-white/10 py-3 rounded-xl">📍 Share My Location To Help</button>
</div>
</div>

<canvas id="wallpaperCanvas" width="1080" height="1920" class="hidden"></canvas>

<script>
let profiles = JSON.parse(localStorage.getItem('help_profiles')||'[]');
let currentPhoto = '';

function saveProfile(){
 let p = {
  id: Date.now(),
  n: name.value, b: blood.value, age: age.value, m: medical.value,
  c1: c1.value, c2: c2.value, a: addr.value, photo: currentPhoto
 };
 profiles.push(p);
 localStorage.setItem('help_profiles', JSON.stringify(profiles));
 localStorage.setItem('help_current', JSON.stringify(p));
 generateQR(p);
 renderProfiles();
}

function generateQR(p){
 let text = `EMERGENCY\n${p.n}\nBlood:${p.b} Age:${p.age}\nMedical:${p.m}\nC1:${p.c1}\nC2:${p.c2}\nAddr:${p.a}`;
 let url = `https://api.qrserver.com/v1/create-qr-code/?size=600x600&data=${encodeURIComponent(text)}`;
 qrBox.classList.remove('hidden');
 document.getElementById('qrImg').src = url;
 document.getElementById('dlBtn').href = url;
 document.getElementById('qrName').innerText = `${p.n} | ${p.b}`;
 // Make shareable link
 location.hash = btoa(unescape(encodeURIComponent(JSON.stringify(p))));
}

function loadPhoto(e){
 let r = new FileReader();
 r.onload = ()=>{
  currentPhoto = r.result;
  document.getElementById('photoPreview').innerHTML = `<img src="${r.result}" class="w-full h-full object-cover">`;
 };
 r.readAsDataURL(e.target.files[0]);
}

function renderProfiles(){
 let html = `<button onclick="newProfile()" class="bg-white/10 px-4 py-2 rounded-full text-sm">+ New</button>`;
 profiles.forEach(p=>{
  html += `<button onclick="loadP(${p.id})" class="bg-cyan-500/20 border border-cyan-500/30 px-4 py-2 rounded-full text-sm whitespace-nowrap">${p.n}</button>`;
 });
 document.getElementById('profileList').innerHTML = html;
}
function loadP(id){
 let p = profiles.find(x=>x.id==id);
 name.value=p.n; blood.value=p.b; age.value=p.age; medical.value=p.m; c1.value=p.c1; c2.value=p.c2; addr.value=p.a;
 currentPhoto=p.photo||'';
 if(currentPhoto) document.getElementById('photoPreview').innerHTML=`<img src="${currentPhoto}" class="w-full h-full object-cover">`;
 generateQR(p);
}
function newProfile(){ name.value=''; medical.value=''; c1.value=''; c2.value=''; qrBox.classList.add('hidden'); }

function sos(){
 if(!navigator.geolocation){ alert("GPS not enabled"); return; }
 navigator.geolocation.getCurrentPosition(pos=>{
  let lat=pos.coords.latitude, lng=pos.coords.longitude;
  let msg = `🚨 SOS EMERGENCY! I need help!\nMy Location: https://maps.google.com/?q=${lat},${lng}\nName: ${name.value}\nBlood: ${blood.value}\nMedical: ${medical.value}`;
  let num = (c1.value.match(/\d{10,}/)||[''])[0];
  if(num) window.open(`https://wa.me/91${num}?text=${encodeURIComponent(msg)}`);
  else window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`);
 });
}

function makeWallpaper(){
 let c = document.getElementById('wallpaperCanvas');
 let ctx = c.getContext('2d');
 ctx.fillStyle='#020617'; ctx.fillRect(0,0,1080,1920);
 ctx.fillStyle='white'; ctx.font='900 70px Outfit'; ctx.fillText('🚨 EMERGENCY', 60, 200);
 ctx.font='600 50px Outfit'; ctx.fillText(document.getElementById('name').value, 60, 300);
 ctx.fillStyle='#f87171'; ctx.fillText(document.getElementById('blood').value, 60, 380);
 ctx.fillStyle='#4ade80'; ctx.font='40px Outfit'; ctx.fillText(document.getElementById('c1').value, 60, 500);
 ctx.fillText(document.getElementById('c2').value, 60, 570);
 // Draw QR
 let img = document.getElementById('qrImg');
 ctx.drawImage(img, 240, 700, 600, 600);
 let url = c.toDataURL();
 let a = document.createElement('a'); a.href=url; a.download='Emergency-Wallpaper.png'; a.click();
}

// Load emergency view if hash present
window.onload=()=>{
 renderProfiles();
 if(location.hash.length>20){
  try{
   let p = JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1)))));
   document.getElementById('formCard').classList.add('hidden');
   document.getElementById('profileList').classList.add('hidden');
   document.getElementById('emView').classList.remove('hidden');
   document.getElementById('vName').innerText=p.n;
   document.getElementById('vBlood').innerText=p.b+' | Age '+p.age;
   document.getElementById('vMedical').innerText='⚠️ '+p.m;
   document.getElementById('vC1').innerText='📞 CALL '+p.c1; document.getElementById('vC1').href='tel:'+ (p.c1.match(/\d{10,}/)||[''])[0];
   document.getElementById('vC2').innerText='📞 CALL '+p.c2; document.getElementById('vC2').href='tel:'+ (p.c2.match(/\d{10,}/)||[''])[0];
   document.getElementById('vAddr').innerText=p.a;
   if(p.photo){ document.getElementById('vPhoto').src=p.photo; document.getElementById('vPhoto').classList.remove('hidden'); }
  }catch(e){}
 }
 // Load last
 let last = localStorage.getItem('help_current');
 if(last &&!location.hash){ loadP(JSON.parse(last).id); }
}
function installApp(){ alert("On phone: Chrome Menu > Add to Home Screen > Install"); }
</script>
</body>
</html>
